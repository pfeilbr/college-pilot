name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite (node tests/run.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - name: Check authored stats against College Scorecard
        run: python3 scripts/check_drift.py --quiet
